worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Use /tmp for temp directories to avoid permission issues with non-root user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;
        server_name _;

        root /app/frontend/dist;
        index index.html;

        # Serve frontend
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to Flask/Gunicorn
        # NOTE: Using /api without trailing slash and proxy_pass to / ensures exact path mapping if backend expects /api
        # But if the backend expects requests WITHOUT /api, the trailing slash is needed.
        # Based on typical Vite + Flask proxy setups, we proxy to /
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow large uploads if needed (e.g., CSV files)
            client_max_body_size 100M;
            
            # Increase timeouts for long-running ETL requests
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }
    }
}
